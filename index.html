<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jeu Téléphone</title>
<meta name="theme-color" content="#FFF5EA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F1613" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Téléphone">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Figtree:wght@500;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{overscroll-behavior:none}
body{margin:0;font-size:14px}
[hidden]{display:none!important}
</style>
<style>
/* Layout : un seul écran en colonne. Score, bande de chiffres qui défile, zone d'état, clavier à grosses touches. */
:root{
  --bg:#FFF5EA;
  --ink:#5B3B31;
  --accent:#F4743B;
  --accent-edge:#C95724;
  --on-accent:#3A1608;
  --done:#DCD3CD;
  --panel:#FFFFFF;
  --panel-line:#F8D6AE;
  --key:#FFFFFF;
  --key-line:#FBE0BF;
  --key-edge:#F6BF86;
  --key-down:#E6F7F3;
  --teal:#8EDCC8;
  --teal-ink:#0B4337;
  --teal-edge:#6FBFA9;
  --good:#3FAF95;
  --danger:#E5484D;
  --danger-tint:#FDE3E1;
  --font-display:'Unbounded','Arial Rounded MT Bold',system-ui,sans-serif;
  --font-body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1F1613;
    --ink:#F6E7DB;
    --accent:#FF8B55;
    --accent-edge:#B2552A;
    --on-accent:#3A1608;
    --done:#5B4B45;
    --panel:#2B201C;
    --panel-line:#6A4328;
    --key:#3A2B26;
    --key-line:#53392B;
    --key-edge:#8A5226;
    --key-down:#244540;
    --teal:#2E8C79;
    --teal-ink:#EAFBF6;
    --teal-edge:#1F6355;
    --good:#4CC3A9;
    --danger:#FF6B6F;
    --danger-tint:#5A2A2B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1F1613;
  --ink:#F6E7DB;
  --accent:#FF8B55;
  --accent-edge:#B2552A;
  --on-accent:#3A1608;
  --done:#5B4B45;
  --panel:#2B201C;
  --panel-line:#6A4328;
  --key:#3A2B26;
  --key-line:#53392B;
  --key-edge:#8A5226;
  --key-down:#244540;
  --teal:#2E8C79;
  --teal-ink:#EAFBF6;
  --teal-edge:#1F6355;
  --good:#4CC3A9;
  --danger:#FF6B6F;
  --danger-tint:#5A2A2B;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  padding-block:12px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  overscroll-behavior:none;
  -webkit-user-select:none;
  user-select:none;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

.app{
  display:flex;
  flex-direction:column;
  gap:10px;
  height:100%;
  max-width:460px;
  margin:0 auto;
}

.top{display:flex;justify-content:center;flex:none}
.pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  background:var(--teal);
  color:var(--teal-ink);
  font-weight:700;
  font-size:15px;
  padding:8px 18px;
  border-radius:999px;
  box-shadow:0 4px 0 var(--teal-edge);
}
.pill b{font-family:var(--font-display);font-weight:800;font-variant-numeric:tabular-nums}

.score{
  flex:none;
  text-align:center;
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(72px, 24vw, 116px);
  line-height:1;
  font-variant-numeric:tabular-nums;
  margin-top:6px;
}
.sub{
  flex:none;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  font-weight:700;
  font-size:13px;
  letter-spacing:.06em;
  text-transform:uppercase;
  opacity:.75;
}
.sep{width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.6}

.panel{
  position:relative;
  flex:none;
  height:clamp(104px, 19vh, 160px);
  border-radius:30px;
  border:3px solid var(--panel-line);
  background:var(--panel);
  overflow:hidden;
}
.window{
  position:absolute;
  inset:0;
  overflow:hidden;
  -webkit-mask-image:linear-gradient(90deg, transparent 0, #000 16%);
  mask-image:linear-gradient(90deg, transparent 0, #000 16%);
}
.strip{position:absolute;left:0;top:0;height:100%;width:0;will-change:transform}
.cell{
  position:absolute;
  top:0;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:var(--font-display);
  font-weight:800;
  font-size:var(--fs, 56px);
  line-height:1;
  color:var(--accent);
  transition:color .12s;
}
.cell.done{color:var(--done)}
.cell.miss{color:var(--danger)}
.glow{
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(90deg, var(--danger), transparent 45%);
  opacity:calc(var(--dz, 0) * .4);
}
.panel.lost{border-color:var(--danger)}
.panel.shake{animation:shake .28s}
@keyframes shake{
  0%,100%{transform:translateX(0)}
  20%{transform:translateX(-7px)}
  40%{transform:translateX(6px)}
  60%{transform:translateX(-4px)}
  80%{transform:translateX(3px)}
}

.status{
  flex:none;
  min-height:112px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.box{
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:10px;
  text-align:center;
}
.hint{margin:0;font-size:15px;line-height:1.35;font-weight:500;max-width:34ch}
.over-title{margin:0;font-family:var(--font-display);font-weight:800;font-size:20px}
.over-note{margin:0;font-size:15px;font-weight:700;opacity:.8}
.cta{
  border:0;
  cursor:pointer;
  font-family:var(--font-display);
  font-weight:800;
  font-size:16px;
  letter-spacing:.02em;
  padding:12px 30px;
  border-radius:18px;
  background:var(--accent);
  color:var(--on-accent);
  box-shadow:0 5px 0 var(--accent-edge);
}
.cta:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accent-edge)}
.meter-wrap{width:100%;max-width:280px;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.meter-label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.meter{height:10px;border-radius:99px;background:var(--done);overflow:hidden}
.meter i{display:block;height:100%;width:100%;background:var(--good);transform-origin:left center;transform:scaleX(1)}
.meter i.low{background:var(--danger)}

.pad{
  flex:1 1 0;
  min-height:230px;
  display:grid;
  grid-template-columns:repeat(3, 1fr);
  grid-template-rows:repeat(4, 1fr);
  gap:14px;
  padding-bottom:8px;
}
.key{
  min-height:44px;
  padding:0;
  border:2px solid var(--key-line);
  border-radius:22px;
  background:var(--key);
  color:var(--ink);
  font-family:var(--font-display);
  font-weight:800;
  font-size:clamp(26px, 8vw, 38px);
  cursor:pointer;
  box-shadow:0 6px 0 var(--key-edge);
  transition:transform 60ms, box-shadow 60ms, background 60ms;
}
.key.down{transform:translateY(4px);box-shadow:0 2px 0 var(--key-edge);background:var(--key-down)}
.key.bad{background:var(--danger-tint);border-color:var(--danger)}
.key[data-d="0"]{grid-column:2;grid-row:4}
.pad.locked .key:not(.bad){opacity:.45}

@media (prefers-reduced-motion: reduce){
  .panel.shake{animation:none}
  .key,.cell{transition:none}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="pill">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>
      <span>Record <b id="best">0</b></span>
    </div>
  </div>

  <div class="score" id="score">0</div>
  <div class="sub"><span>chiffres tapés</span><span class="sep"></span><span id="speed">1,0 / s</span></div>

  <div class="panel" id="panel">
    <div class="window"><div class="strip" id="strip"></div></div>
    <div class="glow"></div>
  </div>

  <div class="status">
    <div class="box" id="idle">
      <p class="hint">Tape les chiffres dans l'ordre avant qu'ils sortent à gauche. Plus ton score monte, plus les chiffres défilent vite.</p>
      <button class="cta" id="startBtn" type="button">Jouer</button>
    </div>
    <div class="box" id="playing" hidden>
      <div class="meter-wrap">
        <span class="meter-label">Avance</span>
        <div class="meter"><i id="fill"></i></div>
      </div>
    </div>
    <div class="box" id="over" hidden>
      <p class="over-title">Perdu !</p>
      <p class="over-note" id="overNote"></p>
      <button class="cta" id="againBtn" type="button">Rejouer</button>
    </div>
  </div>

  <div class="pad" id="pad">
    <button class="key" type="button" data-d="1">1</button>
    <button class="key" type="button" data-d="2">2</button>
    <button class="key" type="button" data-d="3">3</button>
    <button class="key" type="button" data-d="4">4</button>
    <button class="key" type="button" data-d="5">5</button>
    <button class="key" type="button" data-d="6">6</button>
    <button class="key" type="button" data-d="7">7</button>
    <button class="key" type="button" data-d="8">8</button>
    <button class="key" type="button" data-d="9">9</button>
    <button class="key" type="button" data-d="0">0</button>
  </div>
</div>

<script>
(function(){
  var CELLS = 6;          // chiffres visibles dans la fenêtre
  var START_SLACK = 3;    // avance au départ, en chiffres
  var METER_MAX = 4;      // avance pleine de la jauge
  var STORE = 'jeu-telephone-record';

  var $ = function(id){ return document.getElementById(id); };
  var panel = $('panel'), strip = $('strip'), scoreEl = $('score'), speedEl = $('speed');
  var bestEl = $('best'), fill = $('fill'), overNote = $('overNote');
  var boxes = { idle: $('idle'), play: $('playing'), over: $('over') };
  var keys = document.querySelectorAll('.key');
  var pad = $('pad');

  var state = 'idle';     // idle | play | over
  var seq = [], nodes = {};
  var typed = 0, t = 0, last = 0, raf = 0, cell = 60, best = 0, lockUntil = 0, inputLock = 0;
  var ERROR_PAUSE = 400;  // ms pendant lesquelles le clavier ignore les touches après une erreur

  try { best = parseInt(localStorage.getItem(STORE) || '0', 10) || 0; } catch (e) {}
  bestEl.textContent = best;

  function rnd(){ return Math.floor(Math.random() * 10); }
  function ensure(n){ while (seq.length < n) seq.push(rnd()); }
  function speedFor(score){ return Math.min(7, 1.0 + 0.04 * score); }
  function fmt(v){ return v.toFixed(1).replace('.', ',') + ' / s'; }

  function show(which){
    for (var k in boxes) boxes[k].hidden = (k !== which);
  }

  function mk(i){
    var s = document.createElement('span');
    s.className = 'cell' + (i < typed ? ' done' : '');
    s.textContent = seq[i];
    s.style.left = (i * cell) + 'px';
    s.style.width = cell + 'px';
    strip.appendChild(s);
    nodes[i] = s;
  }

  function render(){
    strip.style.transform = 'translate3d(' + (-t * cell) + 'px,0,0)';
    var lo = Math.max(0, Math.floor(t) - 1), hi = Math.floor(t) + CELLS + 1;
    ensure(hi + 1);
    for (var i = lo; i <= hi; i++) if (!nodes[i]) mk(i);
    for (var k in nodes) if (+k < lo - 1) { strip.removeChild(nodes[k]); delete nodes[k]; }
    var slack = typed - t;
    panel.style.setProperty('--dz', Math.max(0, Math.min(1, (1.4 - slack) / 1.4)).toFixed(3));
    if (state === 'play') {
      fill.style.transform = 'scaleX(' + Math.max(0, Math.min(1, slack / METER_MAX)).toFixed(3) + ')';
      fill.classList.toggle('low', slack < 1.2);
    }
  }

  function layout(){
    var w = panel.clientWidth, h = panel.clientHeight;
    if (!w) return;
    cell = w / CELLS;
    panel.style.setProperty('--fs', Math.min(cell * 1.0, h * 0.62) + 'px');
    for (var k in nodes) {
      nodes[k].style.left = (k * cell) + 'px';
      nodes[k].style.width = cell + 'px';
    }
    render();
  }

  function frame(now){
    if (state !== 'play') return;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    t += speedFor(typed) * dt;
    if (typed - t < -0.15) { gameOver(); return; }
    render();
    raf = requestAnimationFrame(frame);
  }

  function reset(){
    strip.innerHTML = '';
    nodes = {};
    seq = [];
  }

  function preview(){
    reset();
    typed = 3; t = 0;
    ensure(12);
    state = 'idle';
    panel.classList.remove('lost');
    scoreEl.textContent = '0';
    speedEl.textContent = fmt(speedFor(0));
    show('idle');
    layout();
  }

  function start(){
    cancelAnimationFrame(raf);
    reset();
    typed = 0; t = -START_SLACK; inputLock = 0;
    pad.classList.remove('locked');
    ensure(CELLS + 8);
    state = 'play';
    scoreEl.textContent = '0';
    speedEl.textContent = fmt(speedFor(0));
    panel.classList.remove('lost');
    show('play');
    render();
    last = performance.now();
    raf = requestAnimationFrame(frame);
  }

  function gameOver(){
    state = 'over';
    pad.classList.remove('locked');
    cancelAnimationFrame(raf);
    lockUntil = performance.now() + 600;
    var record = typed > best;
    if (record) {
      best = typed;
      bestEl.textContent = best;
      try { localStorage.setItem(STORE, String(best)); } catch (e) {}
    }
    overNote.textContent = typed + (typed > 1 ? ' chiffres' : ' chiffre') +
      (record ? ' · nouveau record' : ' · record ' + best);
    panel.classList.add('lost');
    if (nodes[typed]) nodes[typed].classList.add('miss');
    show('over');
    render();
  }

  // renvoie true si la touche était la bonne
  function press(d){
    if (state !== 'play') return null;
    if (performance.now() < inputLock) return null; // pause après une erreur
    if (typed - t > CELLS - 0.5) return null; // le chiffre n'est pas encore entré dans la fenêtre
    if (d === seq[typed]) {
      if (nodes[typed]) nodes[typed].classList.add('done');
      typed++;
      ensure(typed + CELLS + 4);
      scoreEl.textContent = typed;
      speedEl.textContent = fmt(speedFor(typed));
      return true;
    }
    // une erreur secoue la fenêtre et bloque le clavier un court instant
    inputLock = performance.now() + ERROR_PAUSE;
    pad.classList.add('locked');
    setTimeout(function(){ pad.classList.remove('locked'); }, ERROR_PAUSE);
    panel.classList.remove('shake');
    void panel.offsetWidth;
    panel.classList.add('shake');
    return false;
  }

  function flash(k, ok){
    k.classList.add('down');
    if (ok === false) k.classList.add('bad');
    setTimeout(function(){ k.classList.remove('down'); k.classList.remove('bad'); }, ok === false ? 160 : 90);
  }

  Array.prototype.forEach.call(keys, function(k){
    var d = +k.getAttribute('data-d');
    k.addEventListener('pointerdown', function(e){
      e.preventDefault();
      k.classList.add('down');
      var ok = press(d);
      if (ok === false) k.classList.add('bad');
    });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(function(ev){
      k.addEventListener(ev, function(){ k.classList.remove('down'); k.classList.remove('bad'); });
    });
    // clic clavier (Entrée/Espace sur une touche ciblée) : detail vaut 0
    k.addEventListener('click', function(e){
      if (e.detail === 0) { var ok = press(d); flash(k, ok); }
    });
  });

  document.addEventListener('keydown', function(e){
    if (e.repeat) return;
    if (e.key && e.key.length === 1 && e.key >= '0' && e.key <= '9') {
      var d = +e.key;
      var ok = press(d);
      var k = document.querySelector('.key[data-d="' + d + '"]');
      if (k) flash(k, ok);
    } else if ((e.key === 'Enter' || e.key === ' ') && state !== 'play') {
      var a = document.activeElement;
      if (a && a.tagName === 'BUTTON') return;
      e.preventDefault();
      if (performance.now() >= lockUntil) start();
    }
  });

  $('startBtn').addEventListener('click', start);
  $('againBtn').addEventListener('click', function(){
    if (performance.now() >= lockUntil) start();
  });

  if (window.ResizeObserver) new ResizeObserver(layout).observe(panel);
  window.addEventListener('resize', layout);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);

  preview();
})();
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
</body>
</html>
